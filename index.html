<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microsoft Learn 2.0 // Intune Enterprise Wiki</title>
  
  <style>
    :root {
      --bg-base: #0d1117;
      --bg-surface: #161b22;
      --bg-card: #1c2128;
      --bg-card-hover: #22272e;
      --bg-active: #1f293d;
      
      --border-subtle: #30363d;
      --border-muted: #21262d;
      --border-hover: #484f58;
      --border-active: #58a6ff;
      
      --text-primary: #f0f6fc;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      
      --accent-blue: #58a6ff;
      --accent-green: #3fb950;
      --accent-purple: #bc8cff;
      --accent-orange: #d29922;
      --accent-red: #f85149;
      --accent-teal: #39c5cf;
      --accent-pink: #f778ba;
      
      /* Cores de Categoria */
      --cat-enrollment: #388bfd;
      --cat-config: #bc8cff;
      --cat-security: #f85149;
      --cat-scripts: #d29922;
      --cat-apps: #3fb950;
      --cat-compliance: #39c5cf;
      --cat-updates: #f778ba;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 4px 18px rgba(0, 0, 0, 0.5);
      --shadow-cyan: 0 0 16px rgba(88, 166, 255, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* CUSTOM SCROLLBARS */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-base);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-hover);
    }

    /* TOP HEADER */
    .header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 50;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #1f6feb, #58a6ff);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-cyan);
    }

    .brand-icon svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    .brand-titles h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-v2 {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 12px;
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(88, 166, 255, 0.35);
      text-transform: uppercase;
    }

    .brand-titles p {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* SEARCH BAR */
    .search-box {
      flex: 1;
      max-width: 520px;
      position: relative;
    }

    .search-input-wrapper {
      display: flex;
      align-items: center;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 6px 12px;
      transition: all 0.2s ease;
    }

    .search-input-wrapper:focus-within {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.25);
    }

    .search-input-wrapper svg {
      width: 15px;
      height: 15px;
      fill: var(--text-muted);
      margin-right: 8px;
      flex-shrink: 0;
    }

    .search-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 13px;
      width: 100%;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-shortcut {
      font-size: 11px;
      font-family: var(--font-mono);
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--text-secondary);
      margin-left: 6px;
      user-select: none;
    }

    .search-clear {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: none;
      font-size: 15px;
      padding: 0 4px;
    }

    .search-clear:hover {
      color: var(--text-primary);
    }

    /* HEADER META / STATUS */
    .header-status {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .data-source-badge {
      font-size: 11px;
      font-family: var(--font-mono);
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      background: rgba(63, 185, 80, 0.12);
      color: var(--accent-green);
      border: 1px solid rgba(63, 185, 80, 0.3);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .data-source-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-green);
    }

    /* OS NAVIGATION TABS */
    .os-tabs-nav {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      padding: 0 20px;
      overflow-x: auto;
      flex-shrink: 0;
      gap: 2px;
    }

    .os-tab {
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .os-tab:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.02);
    }

    .os-tab.active {
      color: var(--accent-blue);
      border-bottom-color: var(--accent-blue);
      background: rgba(88, 166, 255, 0.06);
      font-weight: 600;
    }

    .tab-badge {
      background: var(--bg-card);
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .os-tab.active .tab-badge {
      background: rgba(88, 166, 255, 0.2);
      color: var(--accent-blue);
    }

    /* CATEGORY CHIPS BAR */
    .categories-bar {
      background: var(--bg-base);
      border-bottom: 1px solid var(--border-subtle);
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      flex-shrink: 0;
    }

    .cat-chip {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.15s ease;
      font-weight: 500;
    }

    .cat-chip:hover {
      background: var(--bg-card);
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    .cat-chip.active {
      background: rgba(88, 166, 255, 0.15);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
      font-weight: 600;
    }

    /* DUAL PANE CONTAINER */
    .main-workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* LEFT PANE: CARDS LIST */
    .cards-pane {
      width: 440px;
      min-width: 340px;
      max-width: 540px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    .cards-pane-header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(22, 27, 34, 0.95);
      backdrop-filter: blur(8px);
    }

    .cards-pane-header h2 {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .counter-pill {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 1px 7px;
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 11px;
    }

    .cards-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* INDIVIDUAL CARD */
    .wiki-card {
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
      overflow: hidden;
    }

    .wiki-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .wiki-card.active {
      background: var(--bg-active);
      border-color: var(--accent-blue);
      box-shadow: inset 3px 0 0 var(--accent-blue), var(--shadow-sm);
    }

    .card-top-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .badge-os {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .badge-cat {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .cat-tag-enrollment       { background: rgba(56, 139, 253, 0.15); color: var(--cat-enrollment); border: 1px solid rgba(56, 139, 253, 0.3); }
    .cat-tag-config           { background: rgba(188, 140, 255, 0.15); color: var(--cat-config); border: 1px solid rgba(188, 140, 255, 0.3); }
    .cat-tag-security         { background: rgba(248, 81, 73, 0.15); color: var(--cat-security); border: 1px solid rgba(248, 81, 73, 0.3); }
    .cat-tag-scripts          { background: rgba(210, 153, 34, 0.15); color: var(--cat-scripts); border: 1px solid rgba(210, 153, 34, 0.3); }
    .cat-tag-apps             { background: rgba(63, 185, 80, 0.15); color: var(--cat-apps); border: 1px solid rgba(63, 185, 80, 0.3); }
    .cat-tag-compliance       { background: rgba(57, 197, 207, 0.15); color: var(--cat-compliance); border: 1px solid rgba(57, 197, 207, 0.3); }
    .cat-tag-updates          { background: rgba(247, 120, 186, 0.15); color: var(--cat-updates); border: 1px solid rgba(247, 120, 186, 0.3); }

    .card-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 5px;
      line-height: 1.35;
    }

    .card-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
    }

    .card-mechanism {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--accent-blue);
      background: rgba(88, 166, 255, 0.08);
      padding: 1px 6px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    /* RIGHT PANE: DETAIL VIEWER */
    .detail-pane {
      flex: 1;
      background: var(--bg-base);
      overflow-y: auto;
      padding: 30px 40px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* ARTICLE HEADER */
    .article-breadcrumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .article-breadcrumbs a {
      color: var(--accent-blue);
      text-decoration: none;
    }

    .article-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 16px;
    }

    .article-title-group h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .article-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      white-space: nowrap;
      text-decoration: none;
    }

    .btn:hover {
      background: var(--border-subtle);
      border-color: var(--border-hover);
    }

    .btn-blue {
      background: rgba(88, 166, 255, 0.12);
      border-color: rgba(88, 166, 255, 0.4);
      color: var(--accent-blue);
    }

    .btn-blue:hover {
      background: rgba(88, 166, 255, 0.22);
      border-color: var(--accent-blue);
    }

    /* SECTION CARDS */
    .detail-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }

    .detail-card h2 {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .detail-card h2 svg {
      width: 17px;
      height: 17px;
      fill: var(--accent-blue);
    }

    /* PORTAL PATH BOX */
    .portal-box {
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .portal-box-text {
      overflow-x: auto;
      white-space: nowrap;
    }

    .copy-btn-mini {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .copy-btn-mini:hover {
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    .body-text {
      font-size: 14px;
      line-height: 1.65;
      color: #c9d1d9;
    }

    /* BUSINESS IMPACT CALLOUT */
    .callout-impact {
      background: rgba(63, 185, 80, 0.08);
      border: 1px solid rgba(63, 185, 80, 0.28);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      color: #b4f3b8;
      font-size: 13.5px;
      line-height: 1.55;
    }

    .callout-impact svg {
      width: 20px;
      height: 20px;
      fill: var(--accent-green);
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* CODE BLOCK */
    .code-container {
      background: #080c12;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-top: 4px;
    }

    .code-header {
      background: #121720;
      border-bottom: 1px solid var(--border-subtle);
      padding: 7px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .code-lang-label {
      font-size: 11px;
      font-family: var(--font-mono);
      text-transform: uppercase;
      color: var(--accent-blue);
      font-weight: 600;
    }

    .code-pre {
      padding: 16px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.55;
      color: #e6edf3;
      white-space: pre;
    }

    /* TOAST NOTIFICATION */
    .toast-box {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast-item {
      background: var(--bg-card);
      border: 1px solid var(--accent-green);
      color: var(--text-primary);
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 8px;
      animation: toastIn 0.2s ease;
      pointer-events: auto;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* EMPTY STATE & LOADING */
    .state-view {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .state-view svg {
      width: 44px;
      height: 44px;
      fill: var(--border-hover);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(88, 166, 255, 0.2);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* RESPONSIVE */
    @media (max-width: 960px) {
      .cards-pane {
        width: 100%;
        max-width: none;
      }
      .detail-pane {
        display: none;
      }
      .main-workspace.mobile-reading-mode .cards-pane {
        display: none;
      }
      .main-workspace.mobile-reading-mode .detail-pane {
        display: flex;
      }
      .search-box {
        max-width: 220px;
      }
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header class="header">
    <a href="#" class="brand" onclick="resetFilters(); return false;">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3z"/>
        </svg>
      </div>
      <div class="brand-titles">
        <h1>Microsoft Learn 2.0 <span class="badge-v2">Enterprise Wiki</span></h1>
        <p>Microsoft Intune • Modern Management Architecture</p>
      </div>
    </a>

    <!-- SEARCH BAR -->
    <div class="search-box">
      <div class="search-input-wrapper">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="instant-search" class="search-input" placeholder="Buscar por título, CSP, OMA-URI, script ou mecanismo..." autocomplete="off">
        <button id="search-clear-btn" class="search-clear" title="Limpar busca">&times;</button>
        <span class="search-shortcut">/</span>
      </div>
    </div>

    <!-- STATUS -->
    <div class="header-status">
      <div class="data-source-badge" id="data-status-badge">
        <span class="dot"></span>
        <span id="data-status-text">data.json</span>
      </div>
    </div>
  </header>

  <!-- OS TABS -->
  <nav class="os-tabs-nav" id="os-tabs-container">
    <button class="os-tab active" data-os="all">
      <span>Todos</span>
      <span class="tab-badge" id="badge-count-all">0</span>
    </button>
    <button class="os-tab" data-os="Windows">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M0 3.449L9.75 2.1v9.451H0m10.949-9.602L24 0v11.4H10.949M0 12.6h9.75v9.451L0 20.699M10.949 12.6H24V24l-12.9-1.801"/></svg>
      <span>Windows</span>
      <span class="tab-badge" id="badge-count-windows">0</span>
    </button>
    <button class="os-tab" data-os="iOS / iPadOS">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.76 1.05-1.81.93-2.87-.9.04-2.03.62-2.67 1.38-.56.65-1.06 1.71-.92 2.74 1.02.08 2.04-.5 2.66-1.25z"/></svg>
      <span>iOS / iPadOS</span>
      <span class="tab-badge" id="badge-count-ios">0</span>
    </button>
    <button class="os-tab" data-os="macOS">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
      <span>macOS</span>
      <span class="tab-badge" id="badge-count-macos">0</span>
    </button>
    <button class="os-tab" data-os="Android">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M17.523 15.3414c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.551 0 .9993.4482.9993.9993.0001.5511-.4482.9997-.9993.9997m-11.046 0c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.5511 0 .9993.4482.9993.9993 0 .5511-.4482.9997-.9993.9997m11.4045-6.02l1.9973-3.4592a.416.416 0 00-.1521-.5676.416.416 0 00-.5676.1521l-2.0223 3.503C15.5902 8.411 13.8533 8.0833 12 8.0833s-3.5902.3277-5.1369.8664L4.8408 5.4467a.4161.4161 0 00-.5677-.1521.4157.4157 0 00-.1521.5676l1.9973 3.4592C2.6889 11.1867.3432 14.6589 0 18.761h24c-.3432-4.1021-2.6889-7.5743-6.1185-9.4396"/></svg>
      <span>Android</span>
      <span class="tab-badge" id="badge-count-android">0</span>
    </button>
    <button class="os-tab" data-os="Windows 365">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v10H4zM2 4a2 2 0 00-2 2v10a2 2 0 002 2h7v2H7v2h10v-2h-2v-2h7a2 2 0 002-2V6a2 2 0 00-2-2H2z"/></svg>
      <span>Windows 365</span>
      <span class="tab-badge" id="badge-count-cloudpc">0</span>
    </button>
  </nav>

  <!-- CATEGORY CHIPS -->
  <div class="categories-bar" id="category-chips-container">
    <button class="cat-chip active" data-category="all">Todas</button>
    <button class="cat-chip" data-category="Enrollment">Enrollment</button>
    <button class="cat-chip" data-category="Configuration Profiles">Configuration Profiles</button>
    <button class="cat-chip" data-category="Endpoint Security">Endpoint Security</button>
    <button class="cat-chip" data-category="Scripts & Remediation">Scripts & Remediation</button>
    <button class="cat-chip" data-category="App Management">App Management</button>
    <button class="cat-chip" data-category="Compliance & CA">Compliance & CA</button>
    <button class="cat-chip" data-category="Updates & Lifecycle">Updates & Lifecycle</button>
  </div>

  <!-- DUAL PANE WORKSPACE -->
  <main class="main-workspace" id="main-workspace">

    <!-- LEFT COLUMN: CARDS LIST -->
    <aside class="cards-pane">
      <div class="cards-pane-header">
        <h2>
          Catálogo Técnico
          <span class="counter-pill" id="counter-pill">0</span>
        </h2>
        <span style="font-size: 11px; color: var(--text-muted);">Use ↑/↓ e Enter</span>
      </div>
      <div class="cards-list" id="cards-list">
        <!-- Rendered via JS -->
      </div>
    </aside>

    <!-- RIGHT COLUMN: DETAIL READER -->
    <section class="detail-pane" id="detail-pane">
      <!-- Rendered via JS -->
    </section>

  </main>

  <!-- TOAST CONTAINER -->
  <div class="toast-box" id="toast-box"></div>

  <!-- JAVASCRIPT APP -->
  <script>
    // ESTADO DA APLICAÇÃO
    let state = {
      items: [],
      os: "all",
      category: "all",
      search: "",
      activeId: null,
      isLoading: true
    };

    // MAPA DE CLASSES DE CATEGORIA
    const categoryClassMap = {
      "Enrollment": "cat-tag-enrollment",
      "Configuration Profiles": "cat-tag-config",
      "Endpoint Security": "cat-tag-security",
      "Scripts & Remediation": "cat-tag-scripts",
      "App Management": "cat-tag-apps",
      "Compliance & CA": "cat-tag-compliance",
      "Updates & Lifecycle": "cat-tag-updates"
    };

    // ELEMENTOS DOM
    const searchInput = document.getElementById("instant-search");
    const searchClearBtn = document.getElementById("search-clear-btn");
    const osTabs = document.querySelectorAll(".os-tab");
    const catChips = document.querySelectorAll(".cat-chip");
    const cardsListEl = document.getElementById("cards-list");
    const detailPaneEl = document.getElementById("detail-pane");
    const counterPill = document.getElementById("counter-pill");
    const mainWorkspace = document.getElementById("main-workspace");

    // INICIALIZAÇÃO
    async function init() {
      setupEventListeners();
      showLoadingState();

      try {
        // FETCH DO DATA.JSON LOCAL
        const response = await fetch("data.json");
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const parsed = await response.json();
        if (Array.isArray(parsed)) {
          state.items = parsed;
        } else if (parsed && typeof parsed === "object") {
          let combined = [];
          for (const key of Object.keys(parsed)) {
            if (Array.isArray(parsed[key])) {
              combined = combined.concat(parsed[key]);
            }
          }
          state.items = combined.length > 0 ? combined : (parsed.items || []);
        } else {
          state.items = [];
        }
        document.getElementById("data-status-text").textContent = "data.json (" + state.items.length + " itens)";
      } catch (err) {
        console.warn("Aviso ao carregar data.json via fetch():", err);
        document.getElementById("data-status-badge").style.borderColor = "var(--accent-orange)";
        document.getElementById("data-status-badge").style.color = "var(--accent-orange)";
        document.getElementById("data-status-badge").querySelector(".dot").style.background = "var(--accent-orange)";
        document.getElementById("data-status-text").textContent = "CORS file:// (Requer Servidor)";
        
        cardsListEl.innerHTML = `
          <div class="state-view">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <p style="font-weight: 600; color: var(--accent-orange);">fetch('data.json') bloqueado pelo navegador (file://)</p>
            <p style="font-size: 12px; color: var(--text-muted); max-width: 320px; line-height: 1.5;">
              Ao abrir o arquivo HTML diretamente pelo Finder (duplo clique), a política CORS do navegador bloqueia o carregamento de JSON local.<br><br>
              <strong>Para carregar via fetch('data.json'):</strong>
            </p>
            <code style="background: #080c12; border: 1px solid var(--border-subtle); padding: 6px 12px; border-radius: 4px; font-size: 11px; color: var(--accent-blue); margin: 6px 0;">
              npx serve . &nbsp;|&nbsp; python3 -m http.server
            </code>
          </div>
        `;
        return;
      }

      state.isLoading = false;
      updateOsCounters();

      // Deep-link via Hash
      if (window.location.hash) {
        const hashId = window.location.hash.replace("#", "");
        if (state.items.some(i => i.id === hashId)) {
          state.activeId = hashId;
        }
      }

      if (!state.activeId && state.items.length > 0) {
        state.activeId = state.items[0].id;
      }

      render();
    }

    function showLoadingState() {
      cardsListEl.innerHTML = `
        <div class="state-view">
          <div class="spinner"></div>
          <p style="font-size: 13px;">Carregando dados de 'data.json'...</p>
        </div>
      `;
      detailPaneEl.innerHTML = `
        <div class="state-view">
          <div class="spinner"></div>
          <p style="font-size: 13px;">Carregando especificação técnica...</p>
        </div>
      `;
    }

    function updateOsCounters() {
      document.getElementById("badge-count-all").textContent = state.items.length;
      document.getElementById("badge-count-windows").textContent = state.items.filter(i => i.os === "Windows").length;
      document.getElementById("badge-count-ios").textContent = state.items.filter(i => i.os === "iOS / iPadOS").length;
      document.getElementById("badge-count-macos").textContent = state.items.filter(i => i.os === "macOS").length;
      document.getElementById("badge-count-android").textContent = state.items.filter(i => i.os === "Android").length;
      document.getElementById("badge-count-cloudpc").textContent = state.items.filter(i => i.os === "Windows 365").length;
    }

    // FILTRAGEM
    function getFilteredItems() {
      return state.items.filter(item => {
        // OS filter
        if (state.os !== "all" && item.os !== state.os) {
          return false;
        }
        // Category filter
        if (state.category !== "all" && item.category !== state.category) {
          return false;
        }
        // Search query
        if (state.search.trim()) {
          const q = state.search.toLowerCase().trim();
          const matchTitle = (item.title || "").toLowerCase().includes(q);
          const matchDesc = (item.description || "").toLowerCase().includes(q);
          const matchShort = (item.shortDescription || "").toLowerCase().includes(q);
          const matchPath = (item.path || item.portalPath || "").toLowerCase().includes(q);
          const matchMech = (item.mechanism || "").toLowerCase().includes(q);
          const matchCode = (item.payload || item.codeSnippet || "").toLowerCase().includes(q);
          return matchTitle || matchDesc || matchShort || matchPath || matchMech || matchCode;
        }
        return true;
      });
    }

    // RENDERIZAÇÃO
    function render() {
      const filtered = getFilteredItems();
      counterPill.textContent = filtered.length;

      renderCardsList(filtered);
      renderDetailPane();
    }

    function renderCardsList(filtered) {
      cardsListEl.innerHTML = "";

      if (filtered.length === 0) {
        cardsListEl.innerHTML = `
          <div class="state-view">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <p style="font-weight: 500; font-size: 13px;">Nenhum item corresponde aos filtros</p>
            <button class="btn btn-blue" onclick="resetFilters()" style="margin-top: 6px;">Resetar Filtros</button>
          </div>
        `;
        return;
      }

      // Garantir item ativo
      if (!filtered.some(i => i.id === state.activeId)) {
        state.activeId = filtered[0].id;
      }

      filtered.forEach(item => {
        const isActive = item.id === state.activeId;
        const card = document.createElement("div");
        card.className = `wiki-card ${isActive ? "active" : ""}`;
        card.setAttribute("data-id", item.id);

        const catClass = categoryClassMap[item.category] || "cat-tag-config";

        card.innerHTML = `
          <div class="card-top-row">
            <span class="badge-os">${escapeHtml(item.os)}</span>
            <span class="badge-cat ${catClass}">${escapeHtml(item.category)}</span>
          </div>
          <div class="card-title">${escapeHtml(item.title)}</div>
          <div class="card-desc">${escapeHtml(item.shortDescription || item.description)}</div>
          <div class="card-footer">
            <span class="card-mechanism" title="${escapeHtml(item.mechanism)}">${escapeHtml(item.mechanism)}</span>
          </div>
        `;

        card.addEventListener("click", () => {
          selectItem(item.id);
        });

        cardsListEl.appendChild(card);
      });
    }

    function renderDetailPane() {
      const item = state.items.find(i => i.id === state.activeId);

      if (!item) {
        detailPaneEl.innerHTML = `
          <div class="state-view" style="margin-top: 60px;">
            <p>Selecione uma configuração no catálogo à esquerda para visualizar a documentação completa.</p>
          </div>
        `;
        return;
      }

      const catClass = categoryClassMap[item.category] || "cat-tag-config";
      const itemPath = item.path || item.portalPath || "";
      const itemPayload = item.payload || item.codeSnippet || "";
      const itemLearnUrl = item.learn_url || item.officialLink || "#";

      detailPaneEl.innerHTML = `
        <!-- BREADCRUMB & BACK MOBILE -->
        <div class="article-breadcrumbs">
          <button class="btn" id="mobile-back-btn" onclick="backToCardsList()" style="display: none; padding: 3px 8px; margin-right: 6px;">
            ← Voltar
          </button>
          <span>Microsoft Intune</span>
          <span>/</span>
          <span>${escapeHtml(item.os)}</span>
          <span>/</span>
          <span>${escapeHtml(item.category)}</span>
        </div>

        <!-- TITLE ROW -->
        <div class="article-title-row">
          <div class="article-title-group">
            <h1>${escapeHtml(item.title)}</h1>
            <div class="article-badges">
              <span class="badge-os" style="font-size: 11px; padding: 3px 8px;">${escapeHtml(item.os)}</span>
              <span class="badge-cat ${catClass}" style="font-size: 11px; padding: 3px 8px;">${escapeHtml(item.category)}</span>
            </div>
          </div>
          <div style="display: flex; gap: 8px; flex-shrink: 0;">
            <button class="btn" onclick="copyShareableLink('${item.id}')" title="Copiar link permanente">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
              Link
            </button>
            <a href="${itemLearnUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-blue" title="Abrir no Microsoft Learn">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
              Docs Microsoft
            </a>
          </div>
        </div>

        <!-- CAMINHO NO INTUNE ADMIN CENTER -->
        <div class="detail-card">
          <h2>
            <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
            Caminho no Microsoft Intune Admin Center
          </h2>
          <div class="portal-box">
            <span class="portal-box-text">${escapeHtml(itemPath)}</span>
            <button class="copy-btn-mini" onclick="copyText('${escapeJsString(itemPath)}', 'Caminho copiado!')">
              Copiar Caminho
            </button>
          </div>
        </div>

        <!-- DESCRIÇÃO TÉCNICA E IMPACTO DE NEGÓCIO -->
        <div class="detail-card">
          <h2>
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            Descrição Técnica & Objetivo
          </h2>
          <div class="body-text">
            <p>${escapeHtml(item.description)}</p>
          </div>

          ${item.businessImpact ? `
          <div class="callout-impact">
            <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
            <div>
              <strong style="color: #7ee787; display: block; margin-bottom: 2px;">Impacto de Negócio & Produtividade:</strong>
              ${escapeHtml(item.businessImpact)}
            </div>
          </div>` : ""}
        </div>

        <!-- MECANISMO TÉCNICO -->
        <div class="detail-card">
          <h2>
            <svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
            Mecanismo Técnico de Execução
          </h2>
          <div style="font-size: 13.5px; color: var(--text-secondary);">
            <strong style="color: var(--accent-blue);">Tipo de Carga Útil / Provedor:</strong>
            <span style="background: rgba(88, 166, 255, 0.1); color: var(--accent-blue); padding: 2px 8px; border-radius: 4px; font-family: var(--font-mono); margin-left: 6px;">
              ${escapeHtml(item.mechanism)}
            </span>
          </div>
        </div>

        <!-- BLOCO DE CÓDIGO/SINTAXE -->
        <div class="detail-card">
          <h2>
            <svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
            Bloco de Código / Sintaxe / Script
          </h2>
          <div class="code-container">
            <div class="code-header">
              <span class="code-lang-label">${escapeHtml(item.codeLang || "syntax / payload")}</span>
              <button class="copy-btn-mini" onclick="copyCurrentCode()">Copiar Código</button>
            </div>
            <pre class="code-pre" id="code-snippet-pre">${escapeHtml(itemPayload)}</pre>
          </div>
        </div>

        <!-- DOCUMENTAÇÃO OFICIAL -->
        <div class="detail-card" style="border-color: rgba(88, 166, 255, 0.3);">
          <h2>
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
            Referência Técnica Oficial Microsoft Learn
          </h2>
          <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 4px;">
            Consulte a especificação formal, notas de lançamento e esquemas CSP na documentação oficial:
          </p>
          <a href="${itemLearnUrl}" target="_blank" rel="noopener noreferrer" style="color: var(--accent-blue); word-break: break-all; font-size: 13px;">
            ${escapeHtml(itemLearnUrl)} ↗
          </a>
        </div>
      `;

      if (window.innerWidth <= 960) {
        const backBtn = document.getElementById("mobile-back-btn");
        if (backBtn) backBtn.style.display = "inline-flex";
      }
    }

    // SELEÇÃO DE ITEM
    function selectItem(id) {
      state.activeId = id;
      window.location.hash = id;

      document.querySelectorAll(".wiki-card").forEach(c => {
        if (c.dataset.id === id) {
          c.classList.add("active");
          c.scrollIntoView({ block: "nearest", behavior: "smooth" });
        } else {
          c.classList.remove("active");
        }
      });

      renderDetailPane();

      if (window.innerWidth <= 960) {
        mainWorkspace.classList.add("mobile-reading-mode");
      }
    }

    function backToCardsList() {
      mainWorkspace.classList.remove("mobile-reading-mode");
    }

    function resetFilters() {
      state.os = "all";
      state.category = "all";
      state.search = "";
      searchInput.value = "";
      searchClearBtn.style.display = "none";

      osTabs.forEach(t => t.classList.toggle("active", t.dataset.os === "all"));
      catChips.forEach(c => c.classList.toggle("active", c.dataset.category === "all"));

      render();
    }

    // EVENT LISTENERS
    function setupEventListeners() {
      // Busca Instantânea
      searchInput.addEventListener("input", (e) => {
        state.search = e.target.value;
        searchClearBtn.style.display = state.search ? "block" : "none";
        render();
      });

      searchClearBtn.addEventListener("click", () => {
        searchInput.value = "";
        state.search = "";
        searchClearBtn.style.display = "none";
        render();
        searchInput.focus();
      });

      // Abas de SO
      osTabs.forEach(tab => {
        tab.addEventListener("click", () => {
          osTabs.forEach(t => t.classList.remove("active"));
          tab.classList.add("active");
          state.os = tab.dataset.os;
          render();
        });
      });

      // Chips de Categoria
      catChips.forEach(chip => {
        chip.addEventListener("click", () => {
          catChips.forEach(c => c.classList.remove("active"));
          chip.classList.add("active");
          state.category = chip.dataset.category;
          render();
        });
      });

      // Atalhos de Teclado
      document.addEventListener("keydown", (e) => {
        // Pressionar '/' para focar na busca
        if (e.key === "/" && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
          searchInput.select();
        }

        // Pressionar 'Escape' para limpar busca
        if (e.key === "Escape") {
          if (searchInput === document.activeElement) {
            searchInput.value = "";
            state.search = "";
            searchClearBtn.style.display = "none";
            render();
            searchInput.blur();
          }
        }

        // Navegação com setas cima/baixo
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          if (document.activeElement !== searchInput) {
            e.preventDefault();
            navigateCards(e.key === "ArrowDown" ? 1 : -1);
          }
        }
      });

      // Hash change listener
      window.addEventListener("hashchange", () => {
        const hashId = window.location.hash.replace("#", "");
        if (hashId && state.items.some(i => i.id === hashId)) {
          selectItem(hashId);
        }
      });

      window.addEventListener("resize", () => {
        if (window.innerWidth > 960) {
          mainWorkspace.classList.remove("mobile-reading-mode");
        }
      });
    }

    function navigateCards(dir) {
      const filtered = getFilteredItems();
      if (filtered.length === 0) return;
      const idx = filtered.findIndex(i => i.id === state.activeId);
      let nextIdx = idx + dir;
      if (nextIdx < 0) nextIdx = filtered.length - 1;
      if (nextIdx >= filtered.length) nextIdx = 0;
      selectItem(filtered[nextIdx].id);
    }

    // NOTIFICAÇÕES E CLIPBOARD
    function showToast(msg) {
      const box = document.getElementById("toast-box");
      const toast = document.createElement("div");
      toast.className = "toast-item";
      toast.innerHTML = `
        <svg width="15" height="15" viewBox="0 0 24 24" fill="#3fb950"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        <span>${escapeHtml(msg)}</span>
      `;
      box.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transition = "opacity 0.3s ease";
        setTimeout(() => toast.remove(), 300);
      }, 2200);
    }

    function copyText(text, successMsg = "Copiado para a área de transferência!") {
      navigator.clipboard.writeText(text).then(() => {
        showToast(successMsg);
      }).catch(err => {
        console.error("Falha ao copiar texto:", err);
      });
    }

    function copyCurrentCode() {
      const item = state.items.find(i => i.id === state.activeId);
      const code = item ? (item.payload || item.codeSnippet) : "";
      if (code) {
        copyText(code, "Snippet de código copiado!");
      }
    }

    function copyShareableLink(id) {
      const url = `${window.location.origin}${window.location.pathname}#${id}`;
      copyText(url, "Link permanente copiado!");
    }

    // UTILITÁRIOS DE ESCAPE
    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeJsString(str) {
      if (!str) return "";
      return String(str).replace(/'/g, "\\'");
    }

    // BOOTSTRAP
    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
